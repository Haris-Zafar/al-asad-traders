# JVM Memory Tuning (Optimized for 8GB RAM system to prevent disk thrashing)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Gradle Build Performance Optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin Incremental Compilation
kotlin.incremental=true
kotlin.caching.enabled=true

# Android Gradle Plugin Configurations
android.useAndroidX=true
android.nonTransitiveRClass=true
# Fix compatibility with Flutter pub plugins (e.g. mobile_scanner) that still apply 'kotlin-android'
android.newDsl=false
android.builtInKotlin=false
